[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Required: passes CI_ENV=docker through to $_ENV in PHP workers.
; Without this, Wavelog falls back from docker mode to production mode.
clear_env = no

pm = dynamic
pm.max_children = 5
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.process_idle_timeout = 20s
pm.max_requests = 500

access.log = /dev/null
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
