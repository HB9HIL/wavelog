user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
    multi_accept off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout combined;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 0;

    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html;
        index index.php;
        autoindex off;
        charset utf-8;

        # Replaces application/.htaccess and system/.htaccess
        location ^~ /application/ { return 403; }
        location ^~ /system/      { return 403; }

        # RedirectMatch 404 ^/\.git
        location ~ /\.git { return 404; }

        # RedirectMatch 404 ^/docker
        location ~ ^/docker { return 404; }

        # RedirectMatch 410 ^/sitemap
        location ~ ^/sitemap { return 410; }

        # Block all dotfiles
        location ~ /\. { deny all; }

        # Static assets served directly
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            log_not_found off;
        }

        # /backup is a real directory, so it would shadow the Backup controller.
        # htaccess.sample special-cases it the same way.
        location = /backup/ { rewrite ^ /index.php last; }

        # CodeIgniter front-controller.
        # $uri/ allows nginx to resolve directory indexes (e.g. /install/index.php).
        # Without it, /install/ falls through to CodeIgniter and causes a redirect loop.
        location / {
            try_files $uri $uri/ /index.php?/$request_uri;
        }

        # PHP-FPM
        # \.php(/|$) also matches path-info style URLs (e.g. /install/index.php/step/2).
        # fastcgi_split_path_info separates the script from the path suffix,
        # so SCRIPT_FILENAME points to the actual .php file and PATH_INFO carries the rest.
        # $realpath_root resolves symlinks — safer than $document_root for SCRIPT_FILENAME.
        location ~ \.php(/|$) {
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            try_files $fastcgi_script_name =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 600;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }
}
