# Apache access logs as NDJSON, so the container stdout carries one single
# machine-readable format (the application log writes NDJSON as well, see
# $config['log_to_stdout']). Apache escapes quotes, backslashes and
# non-printables in %r/%i values itself, so the JSON stays valid.
LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S%z}t\",\"type\":\"access\",\"remote\":\"%a\",\"method\":\"%m\",\"uri\":\"%U%q\",\"protocol\":\"%H\",\"status\":%>s,\"size\":%O,\"duration_ms\":%{ms}T,\"referer\":\"%{Referer}i\",\"user_agent\":\"%{User-Agent}i\"}" wavelog_json
